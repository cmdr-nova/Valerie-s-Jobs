name: Build tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install package-builder dependencies
        run: npm ci

      - name: Test and build
        run: make build

      - name: Package the mod
        run: |
          mkdir -p release
          zip -j "release/ValeriesJobs-${GITHUB_REF_NAME}.zip" \
            dist/ValeriesJobs.package \
            dist/ValeriesJobs.ts4script

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/ValeriesJobs-${GITHUB_REF_NAME}.zip" \
            "dist/translation-strings.json" \
            --verify-tag \
            --prerelease \
            --title "Valerie's Jobs ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Upload Beta to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.VALERIE_CURSE }}
          CURSEFORGE_PROJECT_ID: "1727866"
          CURSEFORGE_GAME_VERSION_IDS: ${{ vars.CURSEFORGE_GAME_VERSION_IDS }}
        run: python3 tools/upload_curseforge.py
